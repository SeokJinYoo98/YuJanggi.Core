name: Release Core
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Read package version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid version' }
          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          $release = gh release view "v$version" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($release | ConvertFrom-Json).isDraft) {
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $refs = git ls-remote origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read tags' }
          if ($refs) {
            git fetch origin "refs/tags/v$version"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch tag' }
            $commit = git rev-parse 'FETCH_HEAD^{commit}'
            if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) { throw 'Rerun original release or bump version' }
          }
          exit 0
      - name: Check matching UPM version, test and package
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts~/Build-Packages.ps1 -Version $env:VERSION
      - name: Reserve tag and draft release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git ls-remote origin "refs/tags/$RELEASE_TAG")" ]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
      - name: Publish NuGet
        if: steps.version.outputs.skip != 'true'
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/$VERSION/nuget/*.nupkg" \
            --source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
            --api-key "$PACKAGE_TOKEN" --skip-duplicate
      - name: Publish release files
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Core $VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/$VERSION/nuget/*.nupkg artifacts/$VERSION/*.tgz artifacts/$VERSION/core-version.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false
