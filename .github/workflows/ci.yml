name: Core CI
on:
  pull_request:
  push:
    branches: [dev, main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test and validate NuGet and source UPM
        shell: pwsh
        run: ./scripts~/Build-Packages.ps1
